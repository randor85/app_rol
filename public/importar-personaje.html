<!doctype html>
<html lang="es">
<head>
<script>if (location.hostname === "personajes-rol.firebaseapp.com") { location.replace("https://personajes-rol.web.app" + location.pathname + location.search + location.hash); }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar personaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ficha-tema.css">
<script src="ficha-paleta.js"></script>
<script>FichaPaleta.aplicarGuardada({ porDefecto: 'bosque' });</script>
<style>
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--fuente-texto); }
  .imp { max-width: 880px; padding-top: var(--sp-4); padding-bottom: var(--sp-6); }
  .imp-cab { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) 0 var(--sp-2); }
  .imp-cab h1 { font-size: clamp(1.5rem, 5vw, 2.1rem); color: var(--acento); letter-spacing: 0.02em; margin: 0; }
  .imp-cab p { margin: var(--sp-1) 0 0; color: var(--texto-suave); font-size: var(--fs-sm); }
  .bloque { background: var(--surface); border: 1px solid var(--borde); border-radius: var(--radio); padding: var(--sp-4); box-shadow: var(--sombra); display: grid; gap: var(--sp-3); min-width: 0; margin-top: var(--sp-4); }
  .bloque h2 { font-size: var(--fs-lg); color: var(--acento); margin: 0; }
  .bloque p { margin: 0; }
  .ficha .campo { display: grid; gap: var(--sp-1); min-width: 0; align-items: stretch; }
  .ficha a.btn-primario { color: var(--sobre-acento); }
  .ficha .item { display: grid; cursor: pointer; }
  .ficha .hab { display: flex; }
  .campo > span { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--texto-suave); }
  .rejilla { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .fila-clase { display: grid; gap: var(--sp-2); grid-template-columns: 2fr 90px 2fr auto; align-items: end; }
  @media (max-width: 560px) { .fila-clase { grid-template-columns: 1fr 1fr; } }
  .habs { display: grid; gap: var(--sp-1) var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .hab { display: flex; align-items: center; gap: var(--sp-2); min-height: 34px; font-size: var(--fs-sm); }
  .hab small { color: var(--texto-suave); }
  .hab .exp { margin-left: auto; font-size: var(--fs-xs); color: var(--texto-suave); display: inline-flex; gap: 4px; align-items: center; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-2); align-items: start; padding: var(--sp-2); border: 1px solid var(--borde); border-radius: var(--radio-sm); background: var(--surface-2); min-width: 0; }
  .item strong { overflow-wrap: anywhere; }
  .item p { color: var(--texto-suave); font-size: var(--fs-sm); overflow-wrap: anywhere; }
  .avisos { display: grid; gap: var(--sp-2); }
  .aviso ul { margin: 0; padding-left: var(--sp-5); }
  textarea.json { min-height: 140px; font-family: ui-monospace, Consolas, monospace; font-size: var(--fs-sm); }
  .fila-btn { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; }
</style>
</head>
<body>
<main class="ficha imp">
  <div class="imp-cab">
    <div>
      <h1>Importar personaje</h1>
      <p id="sub-campana">Importa un personaje de Alchemy RPG o Fantasy Grounds y revisa antes de crear.</p>
    </div>
    <a class="btn btn-fantasma" id="enlace-volver" href="index.html">⬅ Volver al menú</a>
  </div>

  <div id="aviso-global" class="aviso aviso-mal" role="alert" hidden></div>
  <p id="cargando" class="texto-suave">Cargando…</p>

  <div id="cuerpo" hidden>
    <section class="bloque" aria-labelledby="t-archivo">
      <h2 id="t-archivo">1. El archivo del personaje</h2>
      <p class="texto-suave">Sirve el <strong>JSON</strong> exportado de Alchemy RPG o el <strong>XML</strong> exportado de Fantasy Grounds Unity.</p>
      <label class="campo"><span>Elige el archivo (.json o .xml)</span><input type="file" id="archivo" accept=".json,.xml,application/json,text/xml,application/xml,text/plain"></label>
      <label class="campo"><span>…o pega el contenido</span><textarea id="texto-json" class="json" placeholder='{ "name": "…", "classes": [ … ] }   o   &lt;root&gt;&lt;character&gt;…' spellcheck="false"></textarea></label>
      <div class="fila-btn"><button type="button" class="btn btn-primario" id="btn-analizar">🔍 Analizar</button><span class="texto-suave" id="estado-archivo" role="status"></span></div>
    </section>

    <div id="revision" hidden></div>
    <div id="resultado" hidden></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="ficha-sesion.js?v=77.0"></script>
<script src="spells_data.js"></script>
<script src="spells_alias_es.js"></script>
<script src="classes_data.js"></script>
<script src="rasgos_data.js"></script>
<script src="ficha-generador.js"></script>
<script src="ficha-importador.js"></script>
<script src="importar-personaje.js"></script>
</body>
</html>

<style>
  body { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--fuente-texto); }
  .cc-wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter) var(--sp-8); }
  .cc-top { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; justify-content: space-between; padding: var(--sp-4) 0 var(--sp-2); }
  .cc-wrap h1 { font-family: var(--fuente-titulo); color: var(--acento); font-size: clamp(1.5rem, 5vw, 2.2rem); margin: var(--sp-2) 0 var(--sp-1); }
  .cc-wrap h2, .cc-wrap h3, .cc-wrap h4 { font-family: var(--fuente-titulo); margin: 0; }
  .cc-sub { color: var(--texto-suave); margin: 0 0 var(--sp-4); }
  .cc-wrap a { color: var(--acento); }
  .cc-wrap a.btn { color: var(--texto); }

  /* pestañas */
  .cc-tabs { display: flex; flex-wrap: wrap; gap: var(--sp-2); border-bottom: 1px solid var(--borde); margin-bottom: var(--sp-4); }
  .cc-tab { min-height: var(--toque); padding: 0 var(--sp-4); background: transparent; color: var(--texto-suave); border: 1px solid var(--borde); border-bottom: 0; border-radius: var(--radio-sm) var(--radio-sm) 0 0; font: 700 var(--fs-md) var(--fuente-texto); cursor: pointer; }
  .cc-tab[aria-selected="true"] { background: var(--surface); color: var(--acento); border-color: var(--borde-fuerte); }
  .cc-panel[hidden] { display: none; }

  /* distribución */
  .cc-layout { display: grid; gap: var(--sp-5); grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 1000px) {
    .cc-layout { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
    .cc-prev { position: sticky; top: var(--sp-4); max-height: calc(100vh - 2rem); overflow: auto; }
  }
  .cc-prev { background: var(--surface); border: 1px solid var(--borde); border-radius: var(--radio); padding: var(--sp-4); }
  .cc-prev h3 { color: var(--acento); font-size: var(--fs-lg); }
  .cc-prev h4 { margin: var(--sp-4) 0 var(--sp-2); font-size: var(--fs-md); color: var(--acento-2); }
  .cc-chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: var(--sp-2) 0; }
  .cc-prev .feature-grid { grid-template-columns: 1fr; }

  /* formulario */
  .cc-wrap label.cc-campo, .cc-wrap label.cc-mini { display: grid; gap: var(--sp-1); min-width: 0; }
  .cc-etq, .cc-mini > span, .cc-grupo > legend { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--texto-suave); }
  .cc-grupo { border: 1px solid var(--borde); border-radius: var(--radio-sm); padding: var(--sp-2) var(--sp-3) var(--sp-3); margin: 0; min-width: 0; }
  .cc-grupo > legend { padding: 0 var(--sp-2); }
  .cc-checks { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }
  .cc-checks label { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--texto); min-height: 32px; }
  .cc-checks input[type="checkbox"] { accent-color: var(--acento); width: 20px; height: 20px; }
  .cc-fila { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: flex-end; margin-bottom: var(--sp-2); }
  .cc-mini.corto input { width: 6.5rem; }
  .cc-mini.largo { flex: 1 1 12rem; min-width: 0; }
  .cc-wrap input[type="text"], .cc-wrap input[type="number"], .cc-wrap select, .cc-wrap textarea {
    background: var(--bg); color: var(--texto); border: 1px solid var(--borde-fuerte); border-radius: var(--radio-sm);
    padding: 0.5rem 0.7rem; min-height: var(--toque); font: inherit; max-width: 100%; width: 100%;
  }
  .cc-wrap textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
  .cc-mini.corto input, .cc-mini.corto select { width: 6.5rem; }
  .cc-rasgo { border: 1px solid var(--borde); border-left: 4px solid var(--acento); border-radius: var(--radio-sm); padding: var(--sp-3); margin-bottom: var(--sp-3); background: var(--surface-2); }
  .cc-grid20 { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: var(--sp-2); }
  .cc-grid20 input { text-align: center; padding: 0.4rem 0.2rem; }
  .cc-acciones { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
  .cc-nota { color: var(--texto-suave); font-size: var(--fs-sm); margin: 0; }
  .cc-sub-ed { border: 1px dashed var(--borde-fuerte); border-radius: var(--radio-sm); margin-bottom: var(--sp-3); background: var(--surface-2); }
  .cc-sub-ed > summary { cursor: pointer; padding: var(--sp-3); min-height: var(--toque); font-weight: 800; color: var(--acento-2); display: flex; align-items: center; gap: var(--sp-2); }
  .cc-sub-ed > .cc-sub-cuerpo { padding: 0 var(--sp-3) var(--sp-3); display: grid; gap: var(--sp-3); }
  .cc-errores { margin: 0; padding-left: var(--sp-5); }
  .cc-bloque-msg { margin-bottom: var(--sp-3); }
  #cc-aviso:empty, #cc-confirma:empty { display: none; }
  #cc-aviso, #cc-confirma { margin-bottom: var(--sp-3); }
  .cc-copiar { background: var(--surface); border: 1px dashed var(--borde-fuerte); border-radius: var(--radio); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4); }

  /* lista de lo creado */
  .cc-lista { display: grid; gap: var(--sp-3); }
  .cc-item { background: var(--surface); border: 1px solid var(--borde); border-left: 4px solid var(--acento); border-radius: var(--radio-sm); padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-2); }
  .cc-item h4 { font-size: var(--fs-md); }
  .cc-item .cc-meta { color: var(--texto-suave); font-size: var(--fs-sm); }
  .cc-guia { display: inline-block; font-size: var(--fs-xs); font-weight: 700; border: 1px solid var(--acento); color: var(--acento); border-radius: 4px; padding: 1px 7px; }
  @media (max-width: 480px) {
    .cc-tab { padding: 0 var(--sp-3); font-size: var(--fs-sm); flex: 1 1 auto; }
    .cc-mini.corto input, .cc-mini.corto select { width: 5.5rem; }
  }
  .embebido .cc-top, .embebido h1 { display: none; }
  .embebido .cc-wrap { padding-top: var(--sp-2); }
</style>

<body>
<main class="ficha cc-wrap" id="cc-raiz">
  <div class="cc-top">
    <span class="cc-acciones">
      <a class="btn btn-sm" id="cc-volver" href="classes.html">⬅ Compendio de clases</a>
      <a class="btn btn-sm" href="index.html">Menú principal</a>
    </span>
    <div id="selector-paleta"></div>
  </div>
  <h1>🛠️ Creador de clases y subclases</h1>
  <p class="cc-sub" id="cc-sub">Cargando…</p>

  <div id="cc-aviso" role="status" aria-live="polite"></div>
  <div id="cc-confirma" role="alertdialog" aria-label="Confirmación"></div>

  <div id="cc-app" hidden>
    <div class="cc-tabs" role="tablist" aria-label="Qué quieres hacer">
      <button type="button" class="cc-tab" role="tab" id="tab-clase" aria-controls="panel-clase" aria-selected="true" data-tab="clase">Clase nueva</button>
      <button type="button" class="cc-tab" role="tab" id="tab-subclase" aria-controls="panel-subclase" aria-selected="false" tabindex="-1" data-tab="subclase">Subclase nueva</button>
      <button type="button" class="cc-tab" role="tab" id="tab-lista" aria-controls="panel-lista" aria-selected="false" tabindex="-1" data-tab="lista">📚 Lo creado (<span id="cc-cuenta">0</span>)</button>
    </div>

    <section class="cc-panel" role="tabpanel" id="panel-clase" aria-labelledby="tab-clase">
      <div class="cc-copiar">
        <div class="cc-fila" style="margin:0">
          <div class="cc-mini largo">
            <span id="lbl-copiar">Copiar de una clase existente (punto de partida)</span>
            <select id="cc-copiar-sel" aria-labelledby="lbl-copiar"></select>
          </div>
          <button type="button" class="btn" data-act="copiar-oficial">📋 Copiar de una clase oficial</button>
          <button type="button" class="btn btn-fantasma" data-act="limpiar-clase">Empezar de cero</button>
        </div>
        <p class="cc-nota" style="margin-top:var(--sp-2)">Carga todos sus datos (rasgos, subclases, progresión) para que los modifiques: queda como una clase nueva, la original no se toca.</p>
      </div>
      <div class="cc-layout">
        <form id="form-clase" class="pila" novalidate autocomplete="off"></form>
        <aside class="cc-prev" id="prev-clase" aria-label="Vista previa de la clase" aria-live="off"></aside>
      </div>
    </section>

    <section class="cc-panel" role="tabpanel" id="panel-subclase" aria-labelledby="tab-subclase" hidden>
      <div class="cc-layout">
        <form id="form-sub" class="pila" novalidate autocomplete="off"></form>
        <aside class="cc-prev" id="prev-sub" aria-label="Vista previa de la subclase" aria-live="off"></aside>
      </div>
    </section>

    <section class="cc-panel" role="tabpanel" id="panel-lista" aria-labelledby="tab-lista" hidden>
      <div id="cc-lista"></div>
    </section>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

<script>
(function () {
  'use strict';

  const FIREBASE = {
    apiKey: 'AIzaSyBaCAA748xac6HcrQnY-p1jHRp8_CtgtbU', authDomain: 'personajes-rol.firebaseapp.com',
    databaseURL: 'https://personajes-rol-default-rtdb.firebaseio.com', projectId: 'personajes-rol',
    storageBucket: 'personajes-rol.appspot.com', messagingSenderId: '81108671440', appId: '1:81108671440:web:effb710af86054f4c6f7d5',
  };
  const CC = window.ClasesCustom;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clonar = (x) => JSON.parse(JSON.stringify(x));
  const CAMP = (new URLSearchParams(location.search).get('campana') || '').trim();

  let db = null, uid = '', autorNombre = '', esGM = false;
  let datos = { clases: [], subclases: [] };
  let E = null, S = null;                  // modelos de los editores (clase / subclase)
  let abiertas = {};                       // secciones abiertas del editor de clase
  let tabActual = 'clase';

  // ------------------------------------------------------------------ mensajes en pantalla
  function aviso(tipo, html, enfocar) {
    const el = $('cc-aviso');
    el.innerHTML = html ? `<div class="aviso${tipo === 'bien' ? '-bien' : tipo === 'mal' ? '-mal' : ''}" ${tipo === 'mal' ? 'role="alert"' : ''} tabindex="-1" id="cc-aviso-caja"><span>${html}</span><button type="button" class="btn btn-sm btn-fantasma" data-act="cerrar-aviso" aria-label="Cerrar el aviso">✖</button></div>` : '';
    if (html && enfocar) { const c = $('cc-aviso-caja'); if (c) { c.focus(); c.scrollIntoView({ block: 'nearest' }); } }
  }
  function confirmar(texto, etiquetaSi, fn) {
    const el = $('cc-confirma');
    el.innerHTML = `<div class="aviso" id="cc-confirma-caja"><span>${texto}</span><span class="cc-acciones"><button type="button" class="btn btn-sm btn-peligro" data-act="confirma-si">${esc(etiquetaSi)}</button><button type="button" class="btn btn-sm btn-fantasma" data-act="confirma-no">Cancelar</button></span></div>`;
    confirmar.fn = fn;
    const b = el.querySelector('[data-act="confirma-si"]'); if (b) { b.focus(); b.scrollIntoView({ block: 'nearest' }); }
  }
  function cerrarConfirma() { $('cc-confirma').innerHTML = ''; confirmar.fn = null; }

  // ------------------------------------------------------------------ modelo de editor de CLASE
  const num = (v) => { const t = String(v == null ? '' : v).trim(); return t !== '' && !isNaN(Number(t)) ? Number(t) : t; };
  function tablaAFilas(t) {
    return Object.keys(t || {}).sort((a, b) => Number(a) - Number(b)).map((k) => ({ n: String(k), v: String(t[k]) }));
  }
  function filasATabla(rows) {
    const o = {};
    (rows || []).forEach((r) => { const n = String(r.n).trim(), v = String(r.v).trim(); if (n === '' && v === '') return; o[n] = num(v); });
    return o;
  }
  function rasgoAEditor(f) { return { nivel: String(f.nivel), nombre: f.nombre || '', desc: f.desc || '', incierto: !!f.incierto }; }
  function rasgoDeEditor(f) { const r = { nivel: num(f.nivel), nombre: String(f.nombre).trim(), desc: String(f.desc).trim() }; if (f.incierto) r.incierto = true; return r; }
  function arr20(a) { const o = []; for (let i = 0; i < 20; i++) o.push(a && a[i] != null && a[i] !== 0 ? String(a[i]) : (a && a[i] === 0 && a.some((x) => x) ? '0' : '')); return o; }

  function editorDeClase(c) {
    const n = CC.normalizarClase(c, c.id || '');
    const p = n.prog;
    const extra = clonar(p);
    ['prerrequisitos', 'cantrips', 'preparados', 'invocaciones', 'elecciones', 'recursos', 'custom', 'incierto'].forEach((k) => delete extra[k]);
    const m = {
      id: n.id, autor: n.autor, autorNombre: n.autorNombre, creada: n.creada,
      name: n.name, nombre_es: n.nombre_es === n.name ? '' : n.nombre_es, hitDie: String(n.hitDie), primaryAbility: n.primaryAbility,
      savingThrows: n.savingThrows.slice(), casterType: n.casterType || '', subclassLevel: String(n.subclassLevel), subclassLabel: n.subclassLabel,
      resumen: n.resumen, resourceName: n.resourceName || '', resourceRows: tablaAFilas(n.resourceProgression),
      features: n.features.map(rasgoAEditor),
      subclasses: n.subclasses.map((s) => ({ name: s.name, resumen: s.resumen, features: s.features.map(rasgoAEditor), _open: false })),
      prereq: p.prerrequisitos.slice(),
      cantripRows: tablaAFilas(p.cantrips),
      preparados: arr20(p.preparados), invocaciones: arr20(p.invocaciones),
      elecciones: (p.elecciones || []).map((e) => { const x = clonar(e); const o = { nivel: String(x.nivel), tipo: x.tipo, cantidad: String(x.cantidad) }; delete x.nivel; delete x.tipo; delete x.cantidad; o.extra = x; return o; }),
      recursos: (p.recursos || []).map((r) => ({
        id: r.id, nombre: r.nombre, modo: r.max && r.max.tabla ? 'tabla' : 'por', por: String(r.max && r.max.por != null ? r.max.por : ''),
        rows: tablaAFilas(r.max && r.max.tabla), recarga: r.recarga, paso: r.paso != null ? String(r.paso) : '', unidad: r.unidad || '', _idManual: true,
      })),
      extraProg: extra,
    };
    return m;
  }
  function claseDeEditor(m) {
    const c = {
      id: m.id, autor: m.autor, autorNombre: m.autorNombre, creada: m.creada,
      name: m.name.trim(), nombre_es: m.nombre_es.trim(), hitDie: Number(m.hitDie), primaryAbility: m.primaryAbility.trim(),
      savingThrows: CC.SALVACIONES.filter((s) => m.savingThrows.indexOf(s) >= 0),
      casterType: m.casterType || null, subclassLevel: num(m.subclassLevel), subclassLabel: m.subclassLabel.trim(),
      resumen: m.resumen.trim(), resourceName: m.resourceName.trim() || null, resourceProgression: filasATabla(m.resourceRows),
      features: m.features.map(rasgoDeEditor),
      subclasses: m.subclasses.map((s) => ({ name: s.name.trim(), resumen: s.resumen.trim(), features: s.features.map(rasgoDeEditor) })),
    };
    const p = Object.assign({}, m.extraProg);
    delete p.cantrips; delete p.preparados; delete p.invocaciones;
    p.prerrequisitos = m.prereq.slice();
    p.elecciones = m.elecciones.map((e) => Object.assign({}, e.extra, { nivel: num(e.nivel), tipo: e.tipo, cantidad: num(e.cantidad) }));
    if (m.casterType) {
      const ct = filasATabla(m.cantripRows);
      if (Object.keys(ct).length) p.cantrips = ct;
      const veinte = (a) => (a.some((x) => String(x).trim() !== '') ? a.map((x) => (String(x).trim() === '' ? 0 : num(x))) : null);
      const pr = veinte(m.preparados); if (pr) p.preparados = pr;
      if (m.casterType === 'pact') { const iv = veinte(m.invocaciones); if (iv) p.invocaciones = iv; }
    }
    const rec = m.recursos.map((r) => {
      const o = { id: r.id.trim(), nombre: r.nombre.trim(), max: r.modo === 'tabla' ? { tabla: filasATabla(r.rows) } : { por: num(r.por) }, recarga: r.recarga };
      if (String(r.paso).trim() !== '') o.paso = num(r.paso);
      if (r.unidad.trim()) o.unidad = r.unidad.trim();
      return o;
    });
    if (rec.length) p.recursos = rec;
    c.prog = p;
    return c;
  }
  function claseVacia() { return editorDeClase(CC.plantillaClase()); }

  function subDeEditor(m) {
    return { id: m.id, autor: m.autor, autorNombre: m.autorNombre, creada: m.creada, clase: m.clase, name: m.name.trim(), resumen: m.resumen.trim(), features: m.features.map(rasgoDeEditor) };
  }
  function subAEditor(s) {
    const n = CC.normalizarSubclase(s, s.id || '');
    return { id: n.id, autor: n.autor, autorNombre: n.autorNombre, creada: n.creada, clase: n.clase, name: n.name, resumen: n.resumen, features: n.features.map(rasgoAEditor) };
  }
  function subVacia() { return subAEditor({ clase: '', name: '', resumen: '', features: [] }); }

  function abrirPorDefecto(m) {
    abiertas = { basicos: true, rasgos: true, magia: !!m.casterType, recurso: !!m.resourceName, elecciones: m.elecciones.length > 0, recursos: m.recursos.length > 0, subclases: m.subclasses.length > 0 };
  }

  // ------------------------------------------------------------------ HTML del editor
  function filasTablaHTML(r, path, rows, etq) {
    return `<div role="group" aria-label="${esc(etq)}">` + rows.map((f, i) => `
      <div class="cc-fila">
        <label class="cc-mini corto"><span>Nivel</span><input type="number" min="1" max="20" inputmode="numeric" data-r="${r}" data-b="${path}.${i}.n" value="${esc(f.n)}"></label>
        <label class="cc-mini corto"><span>Valor</span><input type="text" data-r="${r}" data-b="${path}.${i}.v" value="${esc(f.v)}"></label>
        <button type="button" class="btn btn-peligro btn-sm" data-act="del" data-r="${r}" data-path="${path}" data-i="${i}" aria-label="Quitar la fila ${i + 1} de «${esc(etq)}»">✖ Quitar</button>
      </div>`).join('') +
      `<button type="button" class="btn btn-fantasma btn-sm" data-act="add" data-r="${r}" data-path="${path}" data-tpl="fila">+ Agregar fila (nivel → valor)</button></div>`;
  }
  function rasgosHTML(r, path, lista, etq) {
    return lista.map((f, i) => `
      <div class="cc-rasgo" role="group" aria-label="${esc(etq)} ${i + 1}">
        <div class="cc-fila">
          <label class="cc-mini corto"><span>Nivel</span><input type="number" min="1" max="20" inputmode="numeric" data-r="${r}" data-b="${path}.${i}.nivel" value="${esc(f.nivel)}"></label>
          <label class="cc-mini largo"><span>Nombre del rasgo</span><input type="text" maxlength="120" data-r="${r}" data-b="${path}.${i}.nombre" value="${esc(f.nombre)}"></label>
          <button type="button" class="btn btn-peligro btn-sm" data-act="del" data-r="${r}" data-path="${path}" data-i="${i}" aria-label="Quitar el ${esc(etq.toLowerCase())} ${i + 1}">✖ Quitar</button>
        </div>
        <label class="cc-mini"><span>Descripción</span><textarea data-r="${r}" data-b="${path}.${i}.desc" maxlength="4000">${esc(f.desc)}</textarea></label>
      </div>`).join('') +
      `<button type="button" class="btn btn-fantasma btn-sm" data-act="add" data-r="${r}" data-path="${path}" data-tpl="rasgo">+ Agregar rasgo</button>`;
  }
  function seccion(key, icono, titulo, cuerpo, nota) {
    return `<details class="seccion" data-sec="${key}"${abiertas[key] ? ' open' : ''}><summary><span class="seccion-icono" aria-hidden="true">${icono}</span> ${titulo}${nota ? ` <span class="seccion-nota">· ${nota}</span>` : ''}</summary><div class="seccion-cuerpo">${cuerpo}</div></details>`;
  }

  function formClaseHTML() {
    const m = E;
    const salv = CC.SALVACIONES.map((s) => `<label><input type="checkbox" data-r="c" data-chk="savingThrows" value="${s}"${m.savingThrows.indexOf(s) >= 0 ? ' checked' : ''}> ${s}</label>`).join('');
    const prer = CC.ABIL.map((a) => `<label><input type="checkbox" data-r="c" data-chk="prereq" value="${a}"${m.prereq.indexOf(a) >= 0 ? ' checked' : ''}> ${CC.ABIL_ES[a]}</label>`).join('');
    const idMostrado = m.id || (m.name.trim() ? CC.slug(m.name) + ' (se genera al guardar)' : '— (se genera del nombre)');
    const basicos = `
      <div class="form-grid">
        <label class="cc-campo"><span class="cc-etq">Nombre (en inglés o el que uses) *</span><input type="text" maxlength="60" data-r="c" data-b="name" value="${esc(m.name)}" required></label>
        <label class="cc-campo"><span class="cc-etq">Nombre en español (opcional)</span><input type="text" maxlength="60" data-r="c" data-b="nombre_es" value="${esc(m.nombre_es)}"></label>
        <label class="cc-campo"><span class="cc-etq">Dado de golpe</span><select data-r="c" data-b="hitDie">${[6, 8, 10, 12].map((d) => `<option value="${d}"${String(d) === m.hitDie ? ' selected' : ''}>d${d}</option>`).join('')}</select></label>
        <label class="cc-campo"><span class="cc-etq">Característica principal *</span><input type="text" maxlength="60" data-r="c" data-b="primaryAbility" value="${esc(m.primaryAbility)}" placeholder="Ej.: Destreza y Sabiduría"></label>
      </div>
      <fieldset class="cc-grupo"><legend>Salvaciones con competencia (elige 2)</legend><div class="cc-checks">${salv}</div></fieldset>
      <fieldset class="cc-grupo"><legend>Prerrequisitos para multiclasear (≥ 13)</legend><div class="cc-checks">${prer}</div></fieldset>
      <label class="cc-campo"><span class="cc-etq">Resumen</span><textarea data-r="c" data-b="resumen" maxlength="2000" placeholder="De qué va la clase, en un par de líneas">${esc(m.resumen)}</textarea></label>
      <div class="form-grid">
        <label class="cc-campo"><span class="cc-etq">La subclase se elige en el nivel</span><input type="number" min="1" max="20" inputmode="numeric" data-r="c" data-b="subclassLevel" value="${esc(m.subclassLevel)}"></label>
        <label class="cc-campo"><span class="cc-etq">Cómo se llama la subclase (etiqueta)</span><input type="text" maxlength="40" data-r="c" data-b="subclassLabel" value="${esc(m.subclassLabel)}" placeholder="Ej.: Colegio, Juramento, Senda"></label>
      </div>
      <p class="cc-nota">Identificador: <code>${esc(idMostrado)}</code>${m.autor ? ` · creada por ${esc(m.autorNombre || m.autor)}` : ''}</p>`;

    let magia = `
      <label class="cc-campo"><span class="cc-etq">Tipo de lanzador</span>
        <select data-r="c" data-b="casterType" data-rerender="1">
          <option value=""${m.casterType === '' ? ' selected' : ''}>No lanza conjuros</option>
          <option value="full"${m.casterType === 'full' ? ' selected' : ''}>Completo (como Mago o Clérigo)</option>
          <option value="half"${m.casterType === 'half' ? ' selected' : ''}>Medio (como Paladín o Explorador)</option>
          <option value="pact"${m.casterType === 'pact' ? ' selected' : ''}>Pacto (como Brujo)</option>
        </select></label>`;
    if (m.casterType) {
      magia += `
        <div><h4 style="font-size:var(--fs-md);margin-bottom:var(--sp-2)">Trucos conocidos (desde qué nivel cambia el número)</h4>${filasTablaHTML('c', 'cantripRows', m.cantripRows, 'Trucos conocidos')}</div>
        <div><h4 style="font-size:var(--fs-md);margin-bottom:var(--sp-2)">Hechizos preparados / conocidos por nivel</h4>
          <div class="cc-grid20">${m.preparados.map((v, i) => `<label class="cc-mini"><span>Nv ${i + 1}</span><input type="number" min="0" inputmode="numeric" data-r="c" data-b="preparados.${i}" value="${esc(v)}"></label>`).join('')}</div></div>`;
      if (m.casterType === 'pact') {
        magia += `<div><h4 style="font-size:var(--fs-md);margin-bottom:var(--sp-2)">Invocaciones conocidas por nivel</h4>
          <div class="cc-grid20">${m.invocaciones.map((v, i) => `<label class="cc-mini"><span>Nv ${i + 1}</span><input type="number" min="0" inputmode="numeric" data-r="c" data-b="invocaciones.${i}" value="${esc(v)}"></label>`).join('')}</div></div>`;
      }
      magia += `<p class="cc-nota">Los espacios de conjuro salen de las tablas oficiales según el tipo de lanzador.</p>`;
    }

    const recurso = `
      <div class="form-grid"><label class="cc-campo"><span class="cc-etq">Nombre del recurso principal</span><input type="text" maxlength="60" data-r="c" data-b="resourceName" value="${esc(m.resourceName)}" placeholder="Ej.: Usos de Rage, Puntos de Hechicería"></label></div>
      <p class="cc-nota">Valor por nivel (escalonado: rige desde el nivel indicado hasta el siguiente). Puede ser un número o texto, como «2d6».</p>
      ${filasTablaHTML('c', 'resourceRows', m.resourceRows, 'Recurso principal')}`;

    const eleccionesH = m.elecciones.map((e, i) => `
      <div class="cc-fila">
        <label class="cc-mini corto"><span>Nivel</span><input type="number" min="1" max="20" inputmode="numeric" data-r="c" data-b="elecciones.${i}.nivel" value="${esc(e.nivel)}"></label>
        <label class="cc-mini"><span>Qué se elige</span><select data-r="c" data-b="elecciones.${i}.tipo">${[['estilo', 'Estilo de combate'], ['expertise', 'Pericia (expertise)'], ['metamagia', 'Metamagia'], ['invocaciones', 'Invocaciones']].map((t) => `<option value="${t[0]}"${e.tipo === t[0] ? ' selected' : ''}>${t[1]}</option>`).join('')}</select></label>
        <label class="cc-mini corto"><span>Cantidad</span><input type="number" min="1" max="20" inputmode="numeric" data-r="c" data-b="elecciones.${i}.cantidad" value="${esc(e.cantidad)}"></label>
        <button type="button" class="btn btn-peligro btn-sm" data-act="del" data-r="c" data-path="elecciones" data-i="${i}" aria-label="Quitar la elección ${i + 1}">✖ Quitar</button>
      </div>`).join('');
    const elecciones = `<p class="cc-nota">Decisiones que el asistente de subida de nivel le pide al jugador al llegar a ese nivel de clase.</p>${eleccionesH}
      <button type="button" class="btn btn-fantasma btn-sm" data-act="add" data-r="c" data-path="elecciones" data-tpl="eleccion">+ Agregar elección</button>`;

    const recursosH = m.recursos.map((r, i) => `
      <div class="cc-rasgo" role="group" aria-label="Recurso ${i + 1}">
        <div class="cc-fila">
          <label class="cc-mini largo"><span>Nombre del contador</span><input type="text" maxlength="60" data-r="c" data-b="recursos.${i}.nombre" value="${esc(r.nombre)}" placeholder="Ej.: Inspiración, Surge"></label>
          <label class="cc-mini corto"><span>Identificador</span><input type="text" maxlength="40" data-r="c" data-b="recursos.${i}.id" value="${esc(r.id)}"></label>
          <label class="cc-mini"><span>Recarga</span><select data-r="c" data-b="recursos.${i}.recarga"><option value="corto"${r.recarga === 'corto' ? ' selected' : ''}>Descanso corto</option><option value="largo"${r.recarga === 'largo' ? ' selected' : ''}>Descanso largo</option></select></label>
          <button type="button" class="btn btn-peligro btn-sm" data-act="del" data-r="c" data-path="recursos" data-i="${i}" aria-label="Quitar el recurso ${i + 1}">✖ Quitar</button>
        </div>
        <div class="cc-fila">
          <label class="cc-mini"><span>Cantidad de usos</span><select data-r="c" data-b="recursos.${i}.modo" data-rerender="1"><option value="por"${r.modo === 'por' ? ' selected' : ''}>Cantidad × nivel de clase</option><option value="tabla"${r.modo === 'tabla' ? ' selected' : ''}>Tabla por nivel</option></select></label>
          ${r.modo === 'por' ? `<label class="cc-mini corto"><span>Usos por nivel</span><input type="number" min="1" inputmode="numeric" data-r="c" data-b="recursos.${i}.por" value="${esc(r.por)}"></label>
          <label class="cc-mini corto"><span>Paso (opcional)</span><input type="number" min="1" inputmode="numeric" data-r="c" data-b="recursos.${i}.paso" value="${esc(r.paso)}"></label>
          <label class="cc-mini corto"><span>Unidad (opcional)</span><input type="text" maxlength="12" data-r="c" data-b="recursos.${i}.unidad" value="${esc(r.unidad)}" placeholder="HP"></label>` : ''}
        </div>
        ${r.modo === 'tabla' ? filasTablaHTML('c', `recursos.${i}.rows`, r.rows, 'Usos de ' + (r.nombre || 'recurso')) : ''}
      </div>`).join('');
    const recursos = `<p class="cc-nota">Contadores propios de la clase que aparecen en la ficha y se restablecen con los descansos.</p>${recursosH}
      <button type="button" class="btn btn-fantasma btn-sm" data-act="add" data-r="c" data-path="recursos" data-tpl="recurso">+ Agregar recurso</button>`;

    const rasgos = `
      <div class="cc-acciones"><button type="button" class="btn btn-sm" data-act="tipicos">✨ Agregar rasgos típicos</button><span class="cc-nota">Mejoras de característica (4, 8, 12, 16, 19) y el rasgo de subclase.</span></div>
      ${rasgosHTML('c', 'features', m.features, 'Rasgo')}`;

    const subs = m.subclasses.map((s, i) => `
      <details class="cc-sub-ed" data-sub="${i}"${s._open ? ' open' : ''}>
        <summary><span aria-hidden="true">🌟</span> ${esc(s.name || 'Subclase sin nombre')}</summary>
        <div class="cc-sub-cuerpo">
          <label class="cc-campo"><span class="cc-etq">Nombre de la subclase</span><input type="text" maxlength="80" data-r="c" data-b="subclasses.${i}.name" value="${esc(s.name)}"></label>
          <label class="cc-campo"><span class="cc-etq">Resumen</span><textarea data-r="c" data-b="subclasses.${i}.resumen" maxlength="2000">${esc(s.resumen)}</textarea></label>
          <div>${rasgosHTML('c', `subclasses.${i}.features`, s.features, 'Rasgo de subclase')}</div>
          <div><button type="button" class="btn btn-peligro btn-sm" data-act="del" data-r="c" data-path="subclasses" data-i="${i}" aria-label="Quitar la subclase ${esc(s.name || (i + 1))}">✖ Quitar esta subclase</button></div>
        </div>
      </details>`).join('');
    const subclases = `<p class="cc-nota">Subclases que vienen con la clase. También puedes sumar más después, desde la pestaña «Subclase nueva».</p>${subs}
      <button type="button" class="btn btn-fantasma btn-sm" data-act="add" data-r="c" data-path="subclasses" data-tpl="subclase">+ Agregar subclase</button>`;

    return `
      ${seccion('basicos', '📝', 'Datos básicos', basicos)}
      ${seccion('magia', '🔮', 'Lanzamiento de conjuros', magia, 'opcional')}
      ${seccion('recurso', '⚡', 'Recurso principal', recurso, 'opcional')}
      ${seccion('rasgos', '📜', 'Rasgos de clase', rasgos, plural(m.features.length, 'cargado', 'cargados'))}
      ${seccion('elecciones', '🎯', 'Elecciones del asistente de nivel', elecciones, 'opcional')}
      ${seccion('recursos', '🔧', 'Recursos con contador', recursos, 'opcional')}
      ${seccion('subclases', '🌟', 'Subclases de la clase', subclases, plural(m.subclasses.length, 'cargada', 'cargadas'))}
      <div id="errores-clase" class="cc-bloque-msg" aria-live="assertive"></div>
      <div class="cc-acciones"><button type="button" class="btn btn-primario" data-act="guardar-clase">💾 ${m.autor ? 'Guardar cambios' : 'Guardar clase'}</button><span class="cc-nota">Se guarda en tu biblioteca global: sirve en todas las campañas.</span></div>`;
  }

  function formSubHTML() {
    const m = S;
    const clases = (typeof CLASSES !== 'undefined' ? CLASSES : []).slice();
    const of = clases.filter((c) => !c.custom), cu = clases.filter((c) => c.custom);
    const opt = (c) => `<option value="${esc(c.id)}"${c.id === m.clase ? ' selected' : ''}>${esc(c.nombre_es || c.name)} (${esc(c.name)})</option>`;
    const base = clases.find((c) => c.id === m.clase);
    return `
      <div class="cc-acciones"><button type="button" class="btn btn-fantasma btn-sm" data-act="limpiar-sub">Empezar de cero</button></div>
      <div class="form-grid">
        <label class="cc-campo"><span class="cc-etq">Clase base *</span>
          <select id="sub-clase" data-r="s" data-b="clase" data-rerender="1"><option value="">— elige una clase —</option>
            <optgroup label="Oficiales">${of.map(opt).join('')}</optgroup>
            ${cu.length ? `<optgroup label="Custom de la campaña">${cu.map(opt).join('')}</optgroup>` : ''}
          </select></label>
        <label class="cc-campo"><span class="cc-etq">Nombre de la subclase *</span><input type="text" maxlength="80" data-r="s" data-b="name" value="${esc(m.name)}"></label>
      </div>
      ${base ? `<p class="cc-nota">${esc(base.nombre_es || base.name)} elige su ${esc(base.subclassLabel)} en el nivel ${esc(base.subclassLevel)}.</p>` : ''}
      <label class="cc-campo"><span class="cc-etq">Resumen</span><textarea data-r="s" data-b="resumen" maxlength="2000" placeholder="En qué se especializa esta subclase">${esc(m.resumen)}</textarea></label>
      <div><h3 style="font-size:var(--fs-lg);color:var(--acento);margin-bottom:var(--sp-2)">Rasgos por nivel</h3>${rasgosHTML('s', 'features', m.features, 'Rasgo')}</div>
      <div id="errores-sub" class="cc-bloque-msg" aria-live="assertive"></div>
      <div class="cc-acciones"><button type="button" class="btn btn-primario" data-act="guardar-sub">💾 ${m.autor ? 'Guardar cambios' : 'Guardar subclase'}</button><span class="cc-nota">Se guarda en tu biblioteca global: sirve en todas las campañas.</span></div>`;
  }

  // ------------------------------------------------------------------ vista previa
  const ordenNivel = (a, b) => (Number(a.nivel) || 99) - (Number(b.nivel) || 99);
  function tarjetas(lista) {
    const l = lista.slice().sort(ordenNivel);
    if (!l.length) return '<p class="cc-nota">Todavía no hay rasgos.</p>';
    return `<div class="feature-grid">${l.map((f) => `<article class="feature-card"><div class="fila"><h4>${esc(f.nombre || 'Sin nombre')}</h4><span class="tag">Nv ${esc(f.nivel)}</span></div><p>${esc(f.desc || '')}</p></article>`).join('')}</div>`;
  }
  function tablaTexto(t) { return Object.keys(t).sort((a, b) => Number(a) - Number(b)).map((k) => `Nv ${k}: ${t[k]}`).join(' · '); }
  function previewClase() {
    const c = claseDeEditor(E);
    const caster = { full: 'Lanzador completo', half: 'Lanzador medio', pact: 'Pact Magic' }[c.casterType] || '';
    const p = c.prog;
    let h = `<h3>${esc(c.nombre_es || c.name || 'Clase sin nombre')} <span class="tag">✨ custom</span></h3>
      <div class="cc-chips"><span class="tag">d${esc(c.hitDie)}</span><span class="tag">${esc(c.primaryAbility)}</span>${c.savingThrows.length ? `<span class="tag">Salv.: ${esc(c.savingThrows.join(', '))}</span>` : ''}${caster ? `<span class="tag">${caster}</span>` : ''}<span class="tag">${esc(c.subclassLabel)} en Nv ${esc(c.subclassLevel)}</span></div>
      ${c.resumen ? `<p>${esc(c.resumen)}</p>` : ''}`;
    if (c.resourceName && Object.keys(c.resourceProgression).length) h += `<p><strong>${esc(c.resourceName)}</strong><br><span class="cc-nota">${esc(tablaTexto(c.resourceProgression))}</span></p>`;
    if (p.cantrips) h += `<p><strong>Trucos</strong><br><span class="cc-nota">${esc(tablaTexto(p.cantrips))}</span></p>`;
    (p.recursos || []).forEach((r) => { h += `<p><strong>${esc(r.nombre || 'Recurso')}</strong> <span class="cc-nota">(${r.recarga === 'corto' ? 'descanso corto' : 'descanso largo'}) ${r.max && r.max.tabla ? esc(tablaTexto(r.max.tabla)) : esc(r.max ? r.max.por : '') + ' × nivel'}</span></p>`; });
    h += `<h4>Rasgos de clase</h4>${tarjetas(c.features)}`;
    c.subclasses.forEach((s) => { h += `<h4>${esc(c.subclassLabel)}: ${esc(s.name || 'sin nombre')}</h4>${s.resumen ? `<p class="cc-nota">${esc(s.resumen)}</p>` : ''}${tarjetas(s.features)}`; });
    $('prev-clase').innerHTML = h;
  }
  function previewSub() {
    const s = subDeEditor(S);
    const base = (typeof CLASSES !== 'undefined' ? CLASSES : []).find((c) => c.id === s.clase);
    $('prev-sub').innerHTML = `<h3>${esc(s.name || 'Subclase sin nombre')} <span class="tag">✨ custom</span></h3>
      <div class="cc-chips">${base ? `<span class="tag">${esc(base.nombre_es || base.name)}</span><span class="tag">${esc(base.subclassLabel)} en Nv ${esc(base.subclassLevel)}</span>` : '<span class="tag">Sin clase base</span>'}</div>
      ${s.resumen ? `<p>${esc(s.resumen)}</p>` : ''}<h4>Rasgos</h4>${tarjetas(s.features)}`;
  }
  let pendiente = 0;
  function pedirPreview() { if (pendiente) return; pendiente = requestAnimationFrame(() => { pendiente = 0; if (E) previewClase(); if (S) previewSub(); }); }

  // ------------------------------------------------------------------ render
  function renderClase(enfocar) {
    $('form-clase').innerHTML = formClaseHTML();
    previewClase();
    if (enfocar) { const el = $('form-clase').querySelector(`[data-b="${enfocar}"]`); if (el) el.focus(); }
  }
  function renderSub(enfocar) {
    $('form-sub').innerHTML = formSubHTML();
    previewSub();
    if (enfocar) { const el = $('form-sub').querySelector(`[data-b="${enfocar}"]`); if (el) el.focus(); }
  }
  function renderCopiar() {
    const cl = (typeof CLASSES !== 'undefined' ? CLASSES : []);
    const prev = $('cc-copiar-sel').value;
    $('cc-copiar-sel').innerHTML = `<optgroup label="Oficiales">${cl.filter((c) => !c.custom).map((c) => `<option value="${esc(c.id)}">${esc(c.nombre_es)} (${esc(c.name)})</option>`).join('')}</optgroup>` +
      (cl.some((c) => c.custom) ? `<optgroup label="Custom de la campaña">${cl.filter((c) => c.custom).map((c) => `<option value="${esc(c.id)}">${esc(c.nombre_es)} (${esc(c.name)})</option>`).join('')}</optgroup>` : '');
    if (prev && cl.some((c) => c.id === prev)) $('cc-copiar-sel').value = prev;
  }

  // ------------------------------------------------------------------ permisos y lista
  // Lo global lo edita solo su autor (no hay GM global); lo antiguo de una campaña, el autor o el GM de esa campaña.
  function puedeEditar(item) { return item.global ? (item.autor && item.autor === uid) : (esGM || (item.autor && item.autor === uid)); }
  // Enlace al compendio: con campaña la conserva (clases de la campaña), sin ella abre el compendio tal cual.
  const urlCompendio = (clase) => 'classes.html?' + (CAMP ? 'campana=' + encodeURIComponent(CAMP) + '&' : '') + 'clase=' + encodeURIComponent(clase);
  const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
  function fecha(ts) { if (!ts) return ''; try { return new Date(ts).toLocaleDateString('es-419'); } catch (e) { return ''; } }
  function renderLista() {
    $('cc-cuenta').textContent = String(datos.clases.length + datos.subclases.length);
    const nomClase = (id) => { const c = (typeof CLASSES !== 'undefined' ? CLASSES : []).find((x) => x.id === id); return c ? (c.nombre_es || c.name) : id; };
    const acciones = (tipo, it, nombre) => puedeEditar(it)
      ? `<span class="cc-acciones"><button type="button" class="btn btn-sm" data-act="editar-${tipo}" data-id="${esc(it.id)}">✏️ Editar</button><button type="button" class="btn btn-sm btn-peligro" data-act="borrar-${tipo}" data-id="${esc(it.id)}" aria-label="Borrar ${esc(nombre)}">🗑️ Borrar</button></span>`
      : `<span class="cc-nota">Solo el autor o el GM pueden editar o borrar esto.</span>`;
    const hijas = (id) => datos.subclases.filter((s) => s.clase === id).length;
    const clasesH = datos.clases.map((c) => `
      <article class="cc-item" data-item="${esc(c.id)}">
        <h4>${esc(c.nombre_es || c.name)} <span class="cc-nota">(${esc(c.name)})</span> <span class="cc-guia">✨ clase custom</span></h4>
        <div class="cc-meta">d${esc(c.hitDie)} · ${plural(c.features.length, 'rasgo', 'rasgos')} · ${plural(hijas(c.id) + c.subclasses.length, 'subclase', 'subclases')} · por ${esc(c.autorNombre || '¿?')} ${esc(fecha(c.creada))}</div>
        <div class="cc-acciones"><a class="btn btn-sm" href="${urlCompendio(c.id)}" target="_top">Ver en el compendio</a>${acciones('clase', c, c.name)}</div>
      </article>`).join('');
    const subsH = datos.subclases.map((s) => `
      <article class="cc-item" data-item="${esc(s.id)}">
        <h4>${esc(s.name)} <span class="cc-guia">✨ subclase custom</span></h4>
        <div class="cc-meta">de ${esc(nomClase(s.clase))} · ${plural(s.features.length, 'rasgo', 'rasgos')} · por ${esc(s.autorNombre || '¿?')} ${esc(fecha(s.creada))}</div>
        <div class="cc-acciones"><a class="btn btn-sm" href="${urlCompendio(s.clase)}" target="_top">Ver en el compendio</a>${acciones('sub', s, s.name)}</div>
      </article>`).join('');
    $('cc-lista').innerHTML = `
      <h2 style="font-size:var(--fs-lg);color:var(--acento);margin-bottom:var(--sp-3)">Clases de la campaña</h2>
      <div class="cc-lista">${clasesH || '<p class="cc-nota" data-vacio="clases">Todavía no hay clases custom en esta campaña.</p>'}</div>
      <h2 style="font-size:var(--fs-lg);color:var(--acento);margin:var(--sp-5) 0 var(--sp-3)">Subclases de la campaña</h2>
      <div class="cc-lista">${subsH || '<p class="cc-nota" data-vacio="subclases">Todavía no hay subclases custom en esta campaña.</p>'}</div>`;
  }

  // ------------------------------------------------------------------ pestañas
  function irATab(t, enfocar) {
    tabActual = t;
    document.querySelectorAll('.cc-tab').forEach((b) => { const s = b.dataset.tab === t; b.setAttribute('aria-selected', String(s)); b.tabIndex = s ? 0 : -1; if (s && enfocar) b.focus(); });
    ['clase', 'subclase', 'lista'].forEach((k) => { $('panel-' + k).hidden = k !== t; });
    if (t === 'subclase') renderSub();
    if (t === 'lista') renderLista();
  }

  // ------------------------------------------------------------------ acciones sobre filas
  const PLANTILLAS = {
    fila: () => ({ n: '', v: '' }),
    rasgo: () => ({ nivel: '1', nombre: '', desc: '', incierto: false }),
    eleccion: () => ({ nivel: '2', tipo: 'estilo', cantidad: '1', extra: {} }),
    recurso: () => ({ id: '', nombre: '', modo: 'por', por: '1', rows: [], recarga: 'largo', paso: '', unidad: '', _idManual: false }),
    subclase: () => ({ name: '', resumen: '', features: [], _open: true }),
  };
  const raiz = (r) => (r === 's' ? S : E);
  function ruta(r, path) {
    const p = path.split('.'); let o = raiz(r);
    for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
    return { o, k: p[p.length - 1] };
  }
  const slugRec = (t) => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ñ/g, 'n').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);

  function alEscribir(ev) {
    const t = ev.target;
    if (!t || !t.dataset) return;
    if (t.dataset.chk) {
      const arr = raiz(t.dataset.r)[t.dataset.chk]; const i = arr.indexOf(t.value);
      if (t.checked && i < 0) arr.push(t.value);
      if (!t.checked && i >= 0) arr.splice(i, 1);
      pedirPreview(); return;
    }
    if (!t.dataset.b) return;
    const { o, k } = ruta(t.dataset.r, t.dataset.b);
    o[k] = t.type === 'checkbox' ? t.checked : t.value;
    // el identificador de un recurso sigue al nombre mientras nadie lo toque
    const m = /^recursos\.(\d+)\.(nombre|id)$/.exec(t.dataset.b);
    if (m) {
      const r = E.recursos[Number(m[1])];
      if (m[2] === 'id') r._idManual = true;
      else if (!r._idManual) { r.id = slugRec(r.nombre); const inp = $('form-clase').querySelector(`[data-b="recursos.${m[1]}.id"]`); if (inp) inp.value = r.id; }
    }
    if (/^subclasses\.\d+\.name$/.test(t.dataset.b)) { const sm = $('form-clase').querySelector(`[data-sub="${t.dataset.b.split('.')[1]}"] > summary`); if (sm) sm.textContent = '🌟 ' + (t.value || 'Subclase sin nombre'); }
    pedirPreview();
  }
  function alCambiar(ev) {
    const t = ev.target;
    if (t && t.dataset && t.dataset.rerender) {
      if (t.dataset.r === 's') renderSub(); else renderClase();
    }
  }

  function descartarAvisos() { aviso('', ''); }

  function accion(ev) {
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'cerrar-aviso') { aviso('', ''); return; }
    if (a === 'confirma-no') { cerrarConfirma(); return; }
    if (a === 'confirma-si') { const f = confirmar.fn; cerrarConfirma(); if (f) f(); return; }
    if (a === 'add') {
      const r = b.dataset.r;
      const arr = (function () { const p = b.dataset.path.split('.'); let x = raiz(r); p.forEach((q) => { x = x[q]; }); return x; })();
      const nuevo = PLANTILLAS[b.dataset.tpl](); arr.push(nuevo);
      const campo = b.dataset.tpl === 'fila' ? 'n' : b.dataset.tpl === 'rasgo' ? 'nombre' : b.dataset.tpl === 'subclase' ? 'name' : b.dataset.tpl === 'recurso' ? 'nombre' : 'nivel';
      if (b.dataset.tpl === 'subclase') abiertas.subclases = true;
      if (r === 's') renderSub(`${b.dataset.path}.${arr.length - 1}.${campo}`); else renderClase(`${b.dataset.path}.${arr.length - 1}.${campo}`);
      return;
    }
    if (a === 'del') {
      const r = b.dataset.r; const p = b.dataset.path.split('.'); let x = raiz(r); p.forEach((q) => { x = x[q]; });
      x.splice(Number(b.dataset.i), 1);
      if (r === 's') renderSub(); else renderClase();
      return;
    }
    if (a === 'tipicos') {
      const ya = (n, nv) => E.features.some((f) => String(f.nivel) === String(nv) && f.nombre.trim().toLowerCase() === n.toLowerCase());
      let n = 0;
      CC.RASGOS_TIPICOS(num(E.subclassLevel), E.subclassLabel).forEach((f) => { if (!ya(f.nombre, f.nivel)) { E.features.push(rasgoAEditor(f)); n++; } });
      abiertas.rasgos = true; renderClase();
      aviso('bien', n ? `Se agregaron ${n} rasgos típicos. Edita la descripción si quieres.` : 'Los rasgos típicos ya estaban cargados.');
      return;
    }
    if (a === 'copiar-oficial') {
      const id = $('cc-copiar-sel').value; const c = (typeof CLASSES !== 'undefined' ? CLASSES : []).find((x) => x.id === id);
      if (!c) return;
      const hacer = () => {
        const copia = clonar(c); delete copia.custom; delete copia.autor; delete copia.autorNombre; delete copia.creada; copia.id = '';
        copia.subclasses = (copia.subclasses || []).map((s) => { const q = clonar(s); delete q.custom; delete q.id; delete q.autor; delete q.autorNombre; return q; });
        copia.name = c.name + ' (copia)'; copia.nombre_es = (c.nombre_es || c.name) + ' (copia)';
        const pg = (typeof PROGRESION_CLASES !== 'undefined' && PROGRESION_CLASES[c.id]) || { prerrequisitos: [], elecciones: [] };
        copia.prog = clonar(pg); delete copia.prog.custom; delete copia.prog.incierto;
        E = editorDeClase(copia); abrirPorDefecto(E); E._sucio = true;
        renderClase('name');
        aviso('bien', `Copiaste «${esc(c.nombre_es || c.name)}». Cámbiale el nombre y modifica lo que quieras: se guarda como una clase nueva.`);
      };
      if (E._sucio) confirmar('Esto reemplaza lo que cargaste en el editor de clase. ¿Seguimos?', 'Sí, reemplazar', hacer); else hacer();
      return;
    }
    if (a === 'limpiar-clase') {
      const hacer = () => { E = claseVacia(); abrirPorDefecto(E); renderClase(); aviso('', ''); };
      if (E._sucio || E.autor) confirmar('Se descarta lo que hay en el editor de clase. ¿Empezamos de cero?', 'Sí, empezar de cero', hacer); else hacer();
      return;
    }
    if (a === 'limpiar-sub') {
      const hacer = () => { S = subVacia(); renderSub(); aviso('', ''); };
      confirmar('Se descarta lo que hay en el editor de subclase. ¿Empezamos de cero?', 'Sí, empezar de cero', hacer);
      return;
    }
    if (a === 'guardar-clase') { guardarClase(); return; }
    if (a === 'guardar-sub') { guardarSub(); return; }
    if (a === 'editar-clase') {
      const c = datos.clases.find((x) => x.id === b.dataset.id); if (!c || !puedeEditar(c)) return;
      const hacer = () => { E = editorDeClase(c); abrirPorDefecto(E); irATab('clase'); renderClase('name'); aviso('', ''); };
      if (E._sucio) confirmar('Tienes cambios sin guardar en el editor de clase. ¿Los descartamos para editar «' + esc(c.name) + '»?', 'Sí, descartar', hacer); else hacer();
      return;
    }
    if (a === 'editar-sub') {
      const s = datos.subclases.find((x) => x.id === b.dataset.id); if (!s || !puedeEditar(s)) return;
      S = subAEditor(s); irATab('subclase'); renderSub('name');
      return;
    }
    if (a === 'borrar-clase' || a === 'borrar-sub') {
      const esClase = a === 'borrar-clase';
      const it = (esClase ? datos.clases : datos.subclases).find((x) => x.id === b.dataset.id); if (!it || !puedeEditar(it)) return;
      const hijas = esClase ? datos.subclases.filter((s) => s.clase === it.id).length : 0;
      confirmar(`¿Borrar ${esClase ? 'la clase' : 'la subclase'} <strong>${esc(it.name)}</strong>?${hijas ? ` Tiene ${hijas} subclase(s) custom aparte que quedarán sin clase (no se van a mostrar).` : ''} No se puede deshacer. Los personajes que ya la usan conservan lo que tienen anotado.`, 'Sí, borrar', () => {
        (esClase ? CC.borrarClase(db, CAMP, it.id) : CC.borrarSubclase(db, CAMP, it.id)).then(() => {
          aviso('bien', `Se borró «${esc(it.name)}».`);
        }).catch((e) => aviso('mal', 'No se pudo borrar: ' + esc(mensajeError(e)), true));
      });
      return;
    }
  }

  function mensajeError(e) {
    const m = e && e.message ? e.message : String(e);
    if (/permission_denied|permission denied/i.test(m)) return 'no tienes permiso para hacer esto (solo el autor o el GM de la campaña pueden modificarlo, o las reglas de la base todavía no se publicaron).';
    return m;
  }
  function mostrarErrores(id, errores) {
    const el = $(id);
    el.innerHTML = errores.length ? `<div class="aviso-mal" role="alert" tabindex="-1" id="${id}-caja" style="display:block"><strong>No se pudo guardar. Revisa esto:</strong><ul class="cc-errores">${errores.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
    if (errores.length) { const c = $(id + '-caja'); c.focus(); c.scrollIntoView({ block: 'center' }); }
  }

  function erroresExtraClase(m) {
    const e = [];
    const dup = (rows, etq) => { const vistos = {}; rows.forEach((r) => { const n = String(r.n).trim(); if (!n) return; if (vistos[n]) e.push(etq + ': el nivel ' + n + ' está repetido.'); vistos[n] = true; }); };
    dup(m.resourceRows, 'Tabla del recurso principal');
    if (m.casterType) dup(m.cantripRows, 'Trucos conocidos');
    m.recursos.forEach((r, i) => { if (r.modo === 'tabla') dup(r.rows, 'Recurso ' + (i + 1)); });
    return e;
  }

  function idLibre(base, usados) {
    let id = base, n = 2;
    while (usados.indexOf(id) >= 0) { id = base.slice(0, 36) + '_' + n; n++; }
    return id;
  }

  function guardarClase() {
    mostrarErrores('errores-clase', []);
    const c = claseDeEditor(E);
    const usados = datos.clases.map((x) => x.id).concat((typeof CLASSES !== 'undefined' ? CLASSES : []).map((x) => x.id));
    if (!c.id) { const base = CC.slug(c.name); c.id = base === CC.PREFIJO ? '' : idLibre(base, usados); }
    let errores = erroresExtraClase(E).concat(CC.validarClase(c, { esNueva: !c.autor, idsExistentes: datos.clases.map((x) => x.id) }));
    errores = errores.filter((x, i) => errores.indexOf(x) === i);
    if (errores.length) { mostrarErrores('errores-clase', errores); return; }
    const btn = $('form-clase').querySelector('[data-act="guardar-clase"]'); if (btn) btn.disabled = true;
    CC.guardarClase(db, CAMP, uid, autorNombre, c).then((g) => {
      E = editorDeClase(Object.assign({}, g, { prog: g.prog })); E._sucio = false;
      abrirPorDefecto(E);
      renderClase();
      aviso('bien', `✅ Clase «${esc(g.name)}» guardada en tu biblioteca global (sirve en todas las campañas). Ya aparece en el <a href="${urlCompendio(g.id)}" target="_top">compendio de clases</a> y en el asistente de subida de nivel.`, true);
    }).catch((e) => {
      if (btn) btn.disabled = false;
      mostrarErrores('errores-clase', e && e.errores ? e.errores : [mensajeError(e)]);
    });
  }
  function guardarSub() {
    mostrarErrores('errores-sub', []);
    const s = subDeEditor(S);
    const usados = datos.subclases.map((x) => x.id);
    if (!s.id) { const base = CC.slug(s.name); s.id = base === CC.PREFIJO ? '' : idLibre(base, usados); }
    const errores = CC.validarSubclase(s, { id: s.id });
    if (errores.length) { mostrarErrores('errores-sub', errores); return; }
    const btn = $('form-sub').querySelector('[data-act="guardar-sub"]'); if (btn) btn.disabled = true;
    CC.guardarSubclase(db, CAMP, uid, autorNombre, s).then((g) => {
      S = subAEditor(g);
      renderSub();
      aviso('bien', `✅ Subclase «${esc(g.name)}» guardada en tu biblioteca global (sirve en todas las campañas). Ya aparece entre las subclases de esa clase en el <a href="${urlCompendio(g.clase)}" target="_top">compendio</a>.`, true);
    }).catch((e) => {
      if (btn) btn.disabled = false;
      mostrarErrores('errores-sub', e && e.errores ? e.errores : [mensajeError(e)]);
    });
  }

  // ------------------------------------------------------------------ arranque
  function marcarSucio(ev) {
    const t = ev.target; if (!t || !t.dataset || !(t.dataset.b || t.dataset.chk)) return;
    if (t.dataset.r === 's') S._sucio = true; else E._sucio = true;
  }
  function conectarEventos() {
    const app = $('cc-app');
    app.addEventListener('input', (ev) => { marcarSucio(ev); alEscribir(ev); });
    app.addEventListener('change', (ev) => { marcarSucio(ev); alEscribir(ev); alCambiar(ev); });
    app.addEventListener('click', accion);
    app.addEventListener('submit', (ev) => ev.preventDefault());
    $('cc-aviso').addEventListener('click', accion);
    $('cc-confirma').addEventListener('click', accion);
    app.addEventListener('toggle', (ev) => {
      const d = ev.target; if (!d || !d.dataset) return;
      if (d.dataset.sec) abiertas[d.dataset.sec] = d.open;
      if (d.dataset.sub != null && E) E.subclasses[Number(d.dataset.sub)]._open = d.open;
    }, true);
    const tabs = Array.from(document.querySelectorAll('.cc-tab'));
    tabs.forEach((b, i) => {
      b.addEventListener('click', () => irATab(b.dataset.tab));
      b.addEventListener('keydown', (ev) => {
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); const j = (i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length; irATab(tabs[j].dataset.tab, true); }
      });
    });
  }

  function arrancar(user) {
    uid = user.uid;
    autorNombre = user.displayName || (user.email ? String(user.email).split('@')[0] : '') || 'Jugador';
    db = firebase.database();
    $('cc-volver').href = 'classes.html' + (CAMP ? '?campana=' + encodeURIComponent(CAMP) : '');
    $('cc-sub').innerHTML = `Sesión de <strong>${esc(autorNombre)}</strong>. Las clases y subclases que crees quedan en tu biblioteca global y sirven en todas las campañas. Todo aparece junto a lo oficial en el compendio y en el asistente de subida de nivel.`;
    E = claseVacia(); abrirPorDefecto(E); S = subVacia();
    conectarEventos();
    $('cc-app').hidden = false;
    renderClase(); renderSub(); renderCopiar(); renderLista();
    if (CAMP) db.ref('campanas/' + CAMP + '/gm').once('value').then((s) => { esGM = !!(s && s.val && s.val() === uid); renderLista(); }).catch(() => {});
    // Lo que creaste antes dentro de una campaña pasa solo a la biblioteca global (sirve para campañas futuras).
    if (CC.migrarALaBiblioteca && CAMP) CC.migrarALaBiblioteca(db, CAMP, uid);
    CC.escuchar(db, CAMP, (d) => {
      if (d.error) { aviso('mal', 'No se pudieron leer las clases de la campaña: ' + esc(mensajeError(d.error))); return; }
      datos = { clases: d.clases, subclases: d.subclases };
      renderCopiar(); renderLista();
      const foco = document.activeElement;
      if (tabActual === 'subclase' && !(foco && foco.closest && foco.closest('#form-sub'))) renderSub();
    });
  }

  function iniciar() {
    if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embebido');   // dentro del compendio: sin barra superior ni título
    if (window.FichaPaleta) FichaPaleta.iniciar({ contenedorId: 'selector-paleta', porDefecto: 'amatista', clave: 'creador-clases' });
    if (CAMP && /[.$#\[\]\/]/.test(CAMP)) { $('cc-sub').textContent = ''; aviso('mal', 'El código de campaña no es válido.'); return; }
    if (!(window.firebase && firebase.auth)) { $('cc-sub').textContent = ''; aviso('mal', 'No se pudo cargar Firebase. Revisa tu conexión y recarga la página.'); return; }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE);
    if (window.FichaSesion) FichaSesion.alUsuario((user) => { if (!db) arrancar(user); }, () => { (window.top || window).location.href = 'index.html'; });
    else firebase.auth().onAuthStateChanged((user) => {
      if (!user) { (window.top || window).location.href = 'index.html'; return; }
      if (!db) arrancar(user);
    });
  }
  iniciar();
})();
</script>
</body>
</html>

<script>
  // Paleta guardada (o la del personaje) aplicada antes de pintar, para evitar el parpadeo.
  (function () {
    var pj = (new URLSearchParams(location.search).get('pj') || '').replace(/[^a-z0-9_]/gi, '');
    FichaPaleta.aplicarGuardada({ porDefecto: FichaPaleta.PERSONAJE_PALETA[pj] || 'bosque', clave: pj });
  })();
</script>

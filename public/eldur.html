<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — redirigiendo…</title>
<!-- La ficha ahora vive en la URL única ficha.html?pj=eldur. Este archivo solo conserva los enlaces viejos.
     La versión anterior de esta ficha quedó como eldur_clasico.html (por si hace falta volver atrás). -->
<script>
  (function () {
    var q = location.search ? '&' + location.search.slice(1) : '';
    location.replace('ficha.html?pj=eldur' + q);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=ficha.html?pj=eldur"></noscript>
</head>
<body style="font-family:sans-serif;background:#111;color:#eee;padding:1.5rem">
<p>Redirigiendo a la ficha… Si no pasa nada, <a href="ficha.html?pj=eldur" style="color:#9fd">ábrela aquí</a>.</p>
</body>
</html>
